services:
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - excali-draw-volume:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Docker/Dockerfile.frontend
    image: ${DOCKERHUB_USERNAME}/collabcanvas-web:latest
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Docker/Dockerfile.backend
    image: ${DOCKERHUB_USERNAME}/collabcanvas-backend:latest
    environment:
      PORT: 3003
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy

  ws-server:
    build:
      context: .
      dockerfile: Docker/Dockerfile.ws-server
    image: ${DOCKERHUB_USERNAME}/collabcanvas-ws:latest
    environment:
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  excali-draw-volume: